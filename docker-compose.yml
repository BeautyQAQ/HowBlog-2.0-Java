# HowBlog 2.0 本地/测试环境启动编排。
#
# 用途：在空环境里拉起隔离的 MySQL、Redis 和三个业务服务，不连接任何既有环境的数据。
# 使用前先把 .env.example 复制为 .env 并填写本地开发用的值；.env 不会被提交。
#
#   cp .env.example .env   # 填入本地开发用的口令与 JWT 密钥
#   docker compose up -d --build
#   curl http://localhost:9008/actuator/health
#   docker compose down -v # 连同本次创建的隔离数据卷一起清理
#
# 说明：
# - MySQL 与 Redis 不映射到宿主机端口，避免和宿主机上既有实例冲突；
#   需要直连调试时，在本地未跟踪的 docker-compose.override.yml 中临时添加 ports。
# - MySQL 只在数据卷为空时执行 docs/ 下的初始化脚本，重复启动不会重建或删除数据。
# - 会话清理保持默认关闭（HOW_AUTH_CLEANUP_ENABLED=false），不会删除认证数据。

services:
  mysql:
    image: ${HOW_COMPOSE_MYSQL_IMAGE:-mysql:8.1.0}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${HOW_COMPOSE_MYSQL_ROOT_PASSWORD:?请在 .env 中设置 HOW_COMPOSE_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: how-blog-smaill
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docs/mysql-auth-migration.sql:/docker-entrypoint-initdb.d/02-auth-migration.sql:ro
      - ./docs/mysql-thumbup-migration.sql:/docker-entrypoint-initdb.d/03-thumbup-migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      # 首次启动要在临时服务器上建库并执行 docs/ 下的初始化脚本，慢盘上可能耗时数分钟；
      # start_period 内的失败不计入重试次数，避免初始化阶段被误判为不健康。
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  redis:
    image: ${HOW_COMPOSE_REDIS_IMAGE:-redis:7-alpine}
    environment:
      REDIS_PASSWORD: ${HOW_COMPOSE_REDIS_PASSWORD:?请在 .env 中设置 HOW_COMPOSE_REDIS_PASSWORD}
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  how-base:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: how_base
        SERVICE_PORT: "9001"
    environment:
      HOW_BASE_PORT: "9001"
      HOW_BASE_DB_URL: "jdbc:mysql://mysql:3306/how-blog-smaill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true"
      HOW_BASE_DB_USER: root
      HOW_BASE_DB_PASSWORD: ${HOW_COMPOSE_MYSQL_ROOT_PASSWORD:?请在 .env 中设置 HOW_COMPOSE_MYSQL_ROOT_PASSWORD}
      HOW_AUTH_JWT_SECRET: ${HOW_AUTH_JWT_SECRET:?请在 .env 中设置 HOW_AUTH_JWT_SECRET}
      HOW_CORS_ALLOWED_ORIGINS: ${HOW_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${HOW_BASE_PUBLISHED_PORT:-9001}:9001"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  how-article:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: how_article
        SERVICE_PORT: "9004"
    environment:
      HOW_ARTICLE_PORT: "9004"
      HOW_ARTICLE_DB_URL: "jdbc:mysql://mysql:3306/how-blog-smaill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true"
      HOW_ARTICLE_DB_USER: root
      HOW_ARTICLE_DB_PASSWORD: ${HOW_COMPOSE_MYSQL_ROOT_PASSWORD:?请在 .env 中设置 HOW_COMPOSE_MYSQL_ROOT_PASSWORD}
      HOW_ARTICLE_REDIS_HOST: redis
      HOW_ARTICLE_REDIS_PORT: "6379"
      HOW_ARTICLE_REDIS_PASSWORD: ${HOW_COMPOSE_REDIS_PASSWORD:?请在 .env 中设置 HOW_COMPOSE_REDIS_PASSWORD}
      HOW_ARTICLE_REDIS_DATABASE: "3"
      HOW_AUTH_JWT_SECRET: ${HOW_AUTH_JWT_SECRET:?请在 .env 中设置 HOW_AUTH_JWT_SECRET}
      HOW_CORS_ALLOWED_ORIGINS: ${HOW_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${HOW_ARTICLE_PUBLISHED_PORT:-9004}:9004"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  how-user:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: how_user
        SERVICE_PORT: "9008"
    environment:
      HOW_USER_PORT: "9008"
      HOW_USER_DB_URL: "jdbc:mysql://mysql:3306/how-blog-smaill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true"
      HOW_USER_DB_USER: root
      HOW_USER_DB_PASSWORD: ${HOW_COMPOSE_MYSQL_ROOT_PASSWORD:?请在 .env 中设置 HOW_COMPOSE_MYSQL_ROOT_PASSWORD}
      HOW_AUTH_REDIS_HOST: redis
      HOW_AUTH_REDIS_PORT: "6379"
      HOW_AUTH_REDIS_PASSWORD: ${HOW_COMPOSE_REDIS_PASSWORD:?请在 .env 中设置 HOW_COMPOSE_REDIS_PASSWORD}
      HOW_AUTH_REDIS_DATABASE: "0"
      HOW_AUTH_JWT_SECRET: ${HOW_AUTH_JWT_SECRET:?请在 .env 中设置 HOW_AUTH_JWT_SECRET}
      HOW_AUTH_CLEANUP_ENABLED: "false"
      HOW_AUTH_RATE_LIMIT_REGISTER_IP_LIMIT: ${HOW_AUTH_RATE_LIMIT_REGISTER_IP_LIMIT:-10}
      HOW_CORS_ALLOWED_ORIGINS: ${HOW_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${HOW_USER_PUBLISHED_PORT:-9008}:9008"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data: