<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HowBlog 公共聊天室</title>
    <style>
        body { max-width: 760px; margin: 32px auto; padding: 0 16px; font-family: system-ui, sans-serif; color: #17202a; background: #eef3f7; }
        section { padding: 18px; background: #fff; border: 1px solid #dce4ea; border-radius: 8px; }
        h1 { margin-top: 0; }
        #status { color: #52606d; }
        #log { height: 55vh; overflow-y: auto; padding: 12px; background: #f7f9fb; border: 1px solid #e1e8ee; }
        #bar { display: grid; grid-template-columns: 1fr 90px; gap: 8px; margin-top: 10px; }
        input, button { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #c7d2dc; border-radius: 5px; font: inherit; }
        button { color: #fff; background: #1769aa; border-color: #1769aa; cursor: pointer; }
        .system { color: #7b8794; font-size: 13px; margin-bottom: 8px; }
        .message { margin-bottom: 8px; }
    </style>
</head>
<body>
<section>
    <h1>HowBlog 公共聊天室</h1>
    <p id="status">正在等待连接</p>
    <div id="log" aria-live="polite"></div>
    <div id="bar">
        <input id="content" disabled placeholder="连接后输入消息">
        <button id="send" disabled>发送</button>
    </div>
</section>
<script>
    const params = new URLSearchParams(location.search);
    const user = params.get('user') || `guest-${Math.random().toString(36).slice(2, 7)}`;
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${location.host}/im?user=${encodeURIComponent(user)}`);
    const log = document.getElementById('log');
    const content = document.getElementById('content');
    const sendButton = document.getElementById('send');

    function append(text, className) {
        const line = document.createElement('div');
        line.className = className || 'message';
        line.textContent = text;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
    }

    socket.onopen = () => {
        document.getElementById('status').textContent = `已连接：${user}`;
        content.disabled = false;
        sendButton.disabled = false;
        socket.send(JSON.stringify({ type: 'join', room: 'lobby' }));
    };
    socket.onmessage = ({ data }) => {
        const event = JSON.parse(data);
        if (event.type === 'message') append(`${event.from}：${event.content}`);
        if (event.type === 'presence') append(`${event.user} ${event.event === 'online' ? '加入聊天室' : '离开聊天室'}`, 'system');
    };
    socket.onclose = () => { document.getElementById('status').textContent = '连接已关闭'; };
    socket.onerror = () => append('无法连接到 IM 服务，请先启动 how_user', 'system');

    function send() {
        const value = content.value.trim();
        if (!value || socket.readyState !== WebSocket.OPEN) return;
        socket.send(JSON.stringify({ type: 'message', room: 'lobby', content: value }));
        content.value = '';
    }
    sendButton.addEventListener('click', send);
    content.addEventListener('keydown', (event) => { if (event.key === 'Enter') send(); });
</script>
</body>
</html>
