<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HowBlog 即时通讯</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #17202a; background: #eef3f7; }
        body { max-width: 960px; margin: 32px auto; padding: 0 16px; }
        main { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
        section { background: #fff; border: 1px solid #dce4ea; border-radius: 8px; padding: 16px; }
        h1 { margin: 0 0 8px; font-size: 24px; }
        h2 { margin: 0 0 12px; font-size: 16px; }
        label { display: block; margin: 10px 0 4px; font-size: 13px; color: #52606d; }
        input, button { box-sizing: border-box; width: 100%; padding: 9px 10px; border: 1px solid #c7d2dc; border-radius: 5px; font: inherit; }
        button { margin-top: 10px; color: #fff; background: #1769aa; border-color: #1769aa; cursor: pointer; }
        button:disabled { opacity: .55; cursor: not-allowed; }
        #status { margin: 0 0 20px; color: #52606d; }
        #messages { height: 420px; overflow-y: auto; padding: 10px; background: #f7f9fb; border: 1px solid #e1e8ee; border-radius: 5px; }
        .message { margin: 0 0 12px; }
        .message strong { color: #1769aa; }
        .system { color: #7b8794; font-size: 13px; }
        #composer { display: grid; grid-template-columns: 1fr 90px; gap: 8px; margin-top: 10px; }
        #composer button { margin: 0; }
        #online { margin: 0; padding-left: 20px; color: #52606d; }
        @media (max-width: 680px) { main { grid-template-columns: 1fr; } #messages { height: 55vh; } }
    </style>
</head>
<body>
<h1>HowBlog 即时通讯</h1>
<p id="status">未连接</p>
<main>
    <section>
        <h2>连接设置</h2>
        <label for="token">登录 token</label>
        <input id="token" autocomplete="off" placeholder="Bearer token 的值">
        <label for="room">房间（留空为广播）</label>
        <input id="room" value="lobby" placeholder="例如：lobby">
        <label for="to">私聊对象（填写后优先私聊）</label>
        <input id="to" placeholder="用户名">
        <button id="connect">连接</button>
        <button id="disconnect" disabled>断开</button>
        <h2 style="margin-top: 24px">在线用户</h2>
        <ul id="online"></ul>
    </section>
    <section>
        <h2 id="conversation">消息</h2>
        <div id="messages" aria-live="polite"></div>
        <div id="composer">
            <input id="content" disabled placeholder="输入消息，按 Enter 发送">
            <button id="send" disabled>发送</button>
        </div>
    </section>
</main>
<script>
    let socket;
    const online = new Set();
    const $ = (id) => document.getElementById(id);

    function addMessage(text, className) {
        const item = document.createElement('div');
        item.className = className || 'message';
        item.textContent = text;
        $('messages').appendChild(item);
        $('messages').scrollTop = $('messages').scrollHeight;
    }

    function renderOnline() {
        $('online').replaceChildren(...Array.from(online).sort().map((user) => {
            const item = document.createElement('li');
            item.textContent = user;
            return item;
        }));
    }

    function setConnected(connected) {
        $('connect').disabled = connected;
        $('disconnect').disabled = !connected;
        $('content').disabled = !connected;
        $('send').disabled = !connected;
    }

    function connect() {
        const token = $('token').value.trim();
        if (!token) { addMessage('请先填写登录 token', 'system'); return; }
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${location.host}/im?token=${encodeURIComponent(token)}`);
        socket.onopen = () => {
            setConnected(true);
            $('status').textContent = '已连接';
            socket.send(JSON.stringify({ type: 'join', room: $('room').value.trim() }));
        };
        socket.onmessage = ({ data }) => {
            const event = JSON.parse(data);
            if (event.type === 'ready') {
                online.add(event.user);
                renderOnline();
                $('status').textContent = `已连接：${event.user}`;
                return;
            }
            if (event.type === 'presence') {
                event.event === 'online' ? online.add(event.user) : online.delete(event.user);
                renderOnline();
                addMessage(`${event.user} ${event.event === 'online' ? '上线' : '离线'}`, 'system');
                return;
            }
            if (event.type === 'message') {
                addMessage(`${event.from}：${event.content}`);
                return;
            }
            if (event.type === 'error') { addMessage(event.message, 'system'); }
        };
        socket.onclose = () => { setConnected(false); $('status').textContent = '连接已关闭'; };
        socket.onerror = () => addMessage('连接失败，请检查登录 token 和 how_user 服务', 'system');
    }

    function send() {
        const content = $('content').value.trim();
        if (!content || !socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(JSON.stringify({ type: 'message', room: $('room').value.trim(), to: $('to').value.trim(), content }));
        $('content').value = '';
    }

    $('connect').addEventListener('click', connect);
    $('disconnect').addEventListener('click', () => socket && socket.close());
    $('send').addEventListener('click', send);
    $('content').addEventListener('keydown', (event) => { if (event.key === 'Enter') send(); });
</script>
</body>
</html>
