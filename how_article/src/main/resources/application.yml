server:
  port: ${HOW_ARTICLE_PORT:9004}
spring:
  application:
    name: how-article #指定服务名
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${HOW_ARTICLE_DB_URL:jdbc:mysql://192.168.20.5:3306/how-blog-smaill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true}
    username: ${HOW_ARTICLE_DB_USER:root}
    password: "${HOW_ARTICLE_DB_PASSWORD:ssyhsup}"
  redis:
    port: ${HOW_ARTICLE_REDIS_PORT:6379}
    host: ${HOW_ARTICLE_REDIS_HOST:192.168.20.5}
    password: "${HOW_ARTICLE_REDIS_PASSWORD:ssyhsup}"
    database: ${HOW_ARTICLE_REDIS_DATABASE:3}
  jpa:
    hibernate:
      ddl-auto: none
how:
  cors:
    allowed-origins: ${HOW_CORS_ALLOWED_ORIGINS:*}
  auth:
    jwt:
      secret: ${HOW_AUTH_JWT_SECRET:}
      access-token-ttl-seconds: ${HOW_AUTH_JWT_ACCESS_TOKEN_TTL_SECONDS:1800}
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
